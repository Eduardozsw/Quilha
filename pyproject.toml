[project]
name = "Quilha"  # como aparece no PyPI; instalação e comando seguem em minúsculo (o PyPI normaliza)
version = "0.2.1"
description = "Agente de carreira local: avalia vagas, gera currículo só com o que você comprova e acompanha candidaturas"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "litellm>=1.102.0",
    "tenacity>=9.1.4",
    "httpx>=0.28",
    "mcp>=2.2.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "typst>=0.15.0",
    "typesafe-sdk>=0.7.2",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "platformdirs>=4.12.4",
]

[project.scripts]
quilha = "hermes.cli:app"
hermes = "hermes.cli:app"  # apelido do nome antigo

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
empacotamento = [
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes"]

# os mesmos padrões que o binário congelado leva (`caminhos.PADROES`), para `caminhos.preparar` copiar
[tool.hatch.build.targets.wheel.force-include]
"competencias.yaml" = "hermes/dados/competencias.yaml"
"curriculos.example.yaml" = "hermes/dados/curriculos.example.yaml"
"fontes.example.yaml" = "hermes/dados/fontes.example.yaml"
"mcp.example.yaml" = "hermes/dados/mcp.example.yaml"
"denylist.example.yaml" = "hermes/dados/denylist.example.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
