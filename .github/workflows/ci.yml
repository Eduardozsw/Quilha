name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # o app tem instalador para os três: os testes rodam nos três
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Testes
        run: uv run pytest
      - name: Schema aplica e consultas rodam
        if: runner.os == 'Linux'
        run: |
          uv run python -c "from hermes.db import store; store.connect('ci.db')"
          grep -v '^\.' hermes/sql/queries.sql | sqlite3 ci.db
      - name: Wheel instala num ambiente limpo e roda
        run: |
          uv build --wheel --out-dir dist
          uv venv /tmp/limpo
          uv pip install --python /tmp/limpo dist/quilha-*.whl
          HERMES_HOME=/tmp/quilha-home /tmp/limpo/bin/quilha diagnostico
