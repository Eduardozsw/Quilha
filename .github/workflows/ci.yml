name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # o app tem instalador para os três: os testes rodam nos três
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Testes
        run: uv run pytest
      - name: Schema aplica e consultas rodam
        if: runner.os == 'Linux'
        run: |
          uv run python -c "from hermes.db import store; store.connect('ci.db')"
          grep -v '^\.' hermes/sql/queries.sql | sqlite3 ci.db
      - name: Wheel instala num ambiente limpo e roda
        shell: bash  # no Windows o padrão é PowerShell
        run: |
          uv build --wheel --out-dir dist
          uv venv "$RUNNER_TEMP/limpo"
          uv pip install --python "$RUNNER_TEMP/limpo" dist/quilha-*.whl
          bin="$RUNNER_TEMP/limpo/bin"; [ -d "$bin" ] || bin="$RUNNER_TEMP/limpo/Scripts"
          HERMES_HOME="$RUNNER_TEMP/quilha-home" "$bin/quilha" diagnostico
